<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公选课刷题台 · Python 与 走进东盟</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1c2333; --sub:#6b7385; --line:#e6eaf2;
    --brand:#3b6ef6; --brand-soft:#e8f0fe; --ok:#18a058; --ok-soft:#e6f6ec;
    --bad:#e5484d; --bad-soft:#fdecec; --warn:#f59e0b; --radius:16px;
    --tab-h:58px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow-x:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink);
    padding-bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    padding:14px 16px 8px;
  }
  header h1{font-size:18px; font-weight:700;}
  header p{font-size:12px; color:var(--sub); margin-top:3px;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:8px 16px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; min-height:44px; display:flex; align-items:center; padding:0 14px;
    border-radius:22px; background:#fff; border:1px solid var(--line); font-size:13px; color:var(--sub);
    cursor:pointer;
  }
  .chip.active{background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600;}
  .wrap{padding:0 16px;}
  .card{
    background:var(--card); border-radius:var(--radius); padding:18px 16px;
    box-shadow:0 2px 12px rgba(20,40,90,.06); margin-bottom:14px;
  }
  .meta{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .tag{font-size:11px; padding:3px 9px; border-radius:10px; background:var(--brand-soft); color:var(--brand);}
  .tag.judge{background:#f3e8ff; color:#8b3ff0;}
  .tag.multi{background:#fff3e0; color:#e08a00;}
  .qno{font-size:12px; color:var(--sub);}
  .qtext{font-size:16px; line-height:1.65; font-weight:600; margin-bottom:14px;}
  .opts{display:flex; flex-direction:column; gap:10px;}
  .opt{
    min-height:44px; display:flex; align-items:flex-start; gap:10px; padding:11px 12px;
    border:1px solid var(--line); border-radius:12px; font-size:14px; line-height:1.5; cursor:pointer;
  }
  .opt .key{flex:0 0 22px; height:22px; border-radius:6px; background:#f0f2f7; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--sub);}
  .opt.sel{border-color:var(--brand); background:var(--brand-soft);}
  .opt.sel .key{background:var(--brand); color:#fff;}
  .opt.correct{border-color:var(--ok); background:var(--ok-soft);}
  .opt.correct .key{background:var(--ok); color:#fff;}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .opt.wrong .key{background:var(--bad); color:#fff;}
  .opt.disabled{cursor:default;}
  .answer-box{margin-top:14px; padding:12px 13px; border-radius:12px; background:#f7f9fc; font-size:13px; line-height:1.6; display:none;}
  .answer-box.show{display:block;}
  .answer-box .ans{font-weight:700; color:var(--ok);}
  .answer-box .note{color:var(--sub); margin-top:4px;}
  .actions{display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1; min-height:44px; border:none; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn.primary{background:var(--brand); color:#fff;}
  .btn.ghost{background:#fff; color:var(--brand); border:1px solid var(--brand);}
  .btn.warn{background:var(--bad-soft); color:var(--bad);}
  .progress{height:6px; background:#e9edf5; border-radius:6px; overflow:hidden; margin:6px 0 14px;}
  .progress i{display:block; height:100%; background:var(--brand); width:0; transition:width .25s;}
  .stat-row{display:flex; gap:10px;}
  .stat-box{flex:1; background:#fff; border-radius:14px; padding:16px 12px; text-align:center;}
  .stat-box .num{font-size:22px; font-weight:700; color:var(--brand);}
  .stat-box .lbl{font-size:12px; color:var(--sub); margin-top:4px;}
  .empty{text-align:center; color:var(--sub); padding:60px 20px; font-size:14px;}
  /* 底部 TabBar */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; height:var(--tab-h); background:#fff;
    border-top:1px solid var(--line); display:flex; z-index:30;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tabbar button{
    flex:1; background:none; border:none; min-height:var(--tab-h); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; font-size:11px; color:var(--sub); cursor:pointer;
  }
  .tabbar button.active{color:var(--brand); font-weight:600;}
  .tabbar .ico{font-size:19px;}
  /* 章节弹层 */
  .sheet-mask{position:fixed; inset:0; background:rgba(15,25,50,.4); z-index:40; display:none;}
  .sheet-mask.show{display:block;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; background:#fff; border-radius:20px 20px 0 0; z-index:41;
    max-height:70vh; overflow-y:auto;
    padding:16px 16px calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px)); display:none;
  }
  .sheet.show{display:block;}
  .sheet h3{font-size:15px; margin-bottom:12px;}
  .sheet .item{
    min-height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    border-bottom:1px solid var(--line); font-size:14px; cursor:pointer;
  }
  .sheet .item.active{color:var(--brand); font-weight:600;}
  .sheet .item .cnt{font-size:12px; color:var(--sub);}
  .course-switch{display:flex; gap:10px; margin-bottom:6px;}
  .course-switch .chip{min-height:40px;}
  @media (min-width:760px){
    .wrap{max-width:720px; margin:0 auto;}
  }
  @media (max-width:380px){
    header h1{font-size:17px;}
    .qtext{font-size:15px;}
    .opt{font-size:13.5px; padding:10px 11px;}
    .stat-box .num{font-size:20px;}
    .chip{font-size:12.5px; padding:0 12px;}
  }
</style>
</head>
<body>

<header>
  <h1>公选课刷题台</h1>
  <p>Python语言基础与应用 · 走进东盟 ｜ 默认隐藏答案，作答后对照</p>
</header>

<div class="chips" id="courseChips"></div>
<div class="chips" id="chapterChips"></div>

<div class="wrap" id="main"></div>

<div class="tabbar">
  <button data-tab="quiz" class="active"><span class="ico">✍️</span>刷题</button>
  <button data-tab="wrong"><span class="ico">📕</span>错题本</button>
  <button data-tab="chapter"><span class="ico">📑</span>章节</button>
  <button data-tab="stat"><span class="ico">📊</span>统计</button>
</div>

<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="chapterSheet"></div>

<script>

    {t:"single", q:"中国与东盟在陆地毗邻而居的国家有哪些？", o:["泰国、老挝、缅甸","越南、老挝、缅甸","马来西亚、老挝、缅甸","新加坡、马来西亚、老挝"], a:["B"]},

    {t:"single", q:"东南亚地区分为两大板块，分别是？", o:["中南半岛和朝鲜半岛","中南半岛和马来半岛","中南半岛和南亚半岛","阿拉伯半岛和马来半岛"], a:["B"]},
    {t:"single", q:"马六甲海峡是沟通哪两大海洋的天然水道？", o:["太平洋和印度洋","太平洋和大西洋","太平洋和北冰洋","大西洋和印度洋"], a:["A"]},

  { name:"泰国", qs:[

<script>
(function(){
  const KEY = "quiz_py_asean_v1";
  const LETTERS = ["A","B","C","D","E"];
  let wrong = {};
  try{ wrong = JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ wrong = {}; }
  function saveWrong(){ try{ localStorage.setItem(KEY, JSON.stringify(wrong)); }catch(e){} }

  // 扁平化全部题目
  const ALL = [];
  DATA.forEach((c,ci)=>c.chapters.forEach((ch,hi)=>ch.qs.forEach((q,qi)=>{
    ALL.push({qid:ci+"-"+hi+"-"+qi, cid:c.id, course:c.name, chapter:ch.name,
      type:q.t, q:q.q, o:q.o, a:q.a});
  })));

  const state = {
    view:"quiz", course:"all", chapter:"all",
    pool:[], pos:0, sel:[], revealed:false, answered:false, lastCorrect:false
  };

  const $ = id=>document.getElementById(id);
  const main = $("main"), courseChips=$("courseChips"), chapterChips=$("chapterChips");

  function syncTab(){
    document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("active", b.dataset.tab===state.view));
  }

  function shuffle(arr){
    const a=arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function currentPool(){
    let list = ALL.slice();
    if(state.course!=="all") list = list.filter(x=>x.cid===state.course);
    if(state.chapter!=="all") list = list.filter(x=>x.chapter===state.chapter);
    return list;
  }

  function typeLabel(t){ return t==="single"?"单选":t==="multi"?"多选":"判断"; }

  // ---------- 顶部 chips ----------
  function renderCourseChips(){
    const items=[{id:"all",name:"全部课程"}].concat(DATA.map(c=>({id:c.id,name:c.name})));
    courseChips.innerHTML = items.map(it=>
      `<div class="chip ${state.course===it.id?"active":""}" data-course="${it.id}">${it.name}</div>`).join("");
    [...courseChips.children].forEach(el=>el.onclick=()=>{
      state.course=el.dataset.course; state.chapter="all";
      state.view="quiz"; syncTab(); startQuiz();
    });
  }
  function renderChapterChips(){
    let names=["全部章节"];
    if(state.course==="all"){
      // 跨课程时不显示章节细分
      chapterChips.innerHTML=""; return;
    }
    const c = DATA.find(x=>x.id===state.course);
    names = names.concat(c.chapters.map(ch=>ch.name));
    chapterChips.innerHTML = names.map(n=>
      `<div class="chip ${state.chapter===n?"active":""}" data-ch="${n}">${n}</div>`).join("");
    [...chapterChips.children].forEach(el=>el.onclick=()=>{
      state.chapter=el.dataset.ch==="全部章节"?"all":el.dataset.ch;
      state.view="quiz"; syncTab(); startQuiz();
    });
  }

  // ---------- 刷题 ----------
  function startQuiz(){
    state.pool = shuffle(currentPool());
    state.pos=0; state.revealed=false; state.answered=false; state.sel=[];
    renderChapterChips();
    if(state.view==="quiz") renderQuiz();
  }

  function renderQuiz(){
    renderCourseChips(); renderChapterChips();
    if(state.pool.length===0){ main.innerHTML=`<div class="empty">当前范围暂无题目</div>`; return; }
    const q = state.pool[state.pos];
    const opts = q.type==="judge" ? ["正确","错误"] : q.o;
    const optHtml = opts.map((text,i)=>{
      const L=LETTERS[i];
      let cls="opt";
      if(state.answered){
        if(q.a.includes(L)) cls+=" correct";
        else if(state.sel.includes(L)) cls+=" wrong";
        cls+=" disabled";
      }else if(state.sel.includes(L)) cls+=" sel";
      return `<div class="${cls}" data-l="${L}">
        <span class="key">${q.type==="judge"?(L==="A"?"✓":"✕"):L}</span><span>${text}</span></div>`;
    }).join("");

    const pct = Math.round((state.pos)/state.pool.length*100);
    main.innerHTML = `
      <div class="card">
        <div class="meta">
          <span class="tag ${q.type==='judge'?'judge':q.type==='multi'?'multi':''}">${typeLabel(q.type)}</span>
          <span class="qno">${q.course} · ${q.chapter}</span>
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
        <div class="qtext">${state.pos+1}. ${q.q}</div>
        <div class="opts">${optHtml}</div>
        <div class="answer-box ${state.revealed?"show":""}">
          <div>正确答案：<span class="ans">${q.a.join("、")}</span></div>
          <div class="note">${state.answered?(state.lastCorrect?"✓ 回答正确":"✗ 回答错误，已收入错题本"):""}</div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btnPrev" ${state.pos===0?"disabled":""}>上一题</button>
          ${state.answered
            ? `<button class="btn primary" id="btnNext">${state.pos===state.pool.length-1?"完成":"下一题"}</button>`
            : `<button class="btn primary" id="btnSubmit">${q.type==="multi"?"提交答案":"显示答案"}</button>`}
        </div>
      </div>`;

    // 选项点击
    [...main.querySelectorAll(".opt")].forEach(el=>{
      el.onclick=()=>{
        if(state.answered) return;
        const L=el.dataset.l;
        if(q.type==="single"||q.type==="judge"){ state.sel=[L]; reveal(); }
        else{
          state.sel = state.sel.includes(L)? state.sel.filter(x=>x!==L) : state.sel.concat(L);
          renderQuizKeep();
        }
      };
    });
    const prev=$("btnPrev"), next=$("btnNext"), sub=$("btnSubmit");
    if(prev) prev.onclick=()=>{ state.pos--; state.sel=[]; state.revealed=false; state.answered=false; renderQuiz(); };
    if(next) next.onclick=()=>{ state.pos++; state.sel=[]; state.revealed=false; state.answered=false; renderQuiz(); };
    if(sub) sub.onclick=()=>{
      if(q.type==="multi" && state.sel.length===0){ alert("请先选择选项"); return; }
      reveal();
    };
  }

  function renderQuizKeep(){
    // 多选选择时局部刷新选项高亮
    const q=state.pool[state.pos];
    [...main.querySelectorAll(".opt")].forEach(el=>{
      const L=el.dataset.l;
      el.classList.toggle("sel", state.sel.includes(L));
    });
  }

  function reveal(){
    const q=state.pool[state.pos];
    const ok = state.sel.slice().sort().join()===q.a.slice().sort().join();
    state.answered=true; state.revealed=true; state.lastCorrect=ok;
    if(ok){ delete wrong[q.qid]; }
    else{
      wrong[q.qid] = {qid:q.qid, course:q.course, chapter:q.chapter, type:q.type, q:q.q, o:q.o, a:q.a,
        count:(wrong[q.qid]?wrong[q.qid].count+1:1)};
    }
    saveWrong();
    renderQuiz();
  }

  // ---------- 错题本 ----------
  function renderWrong(){
    renderCourseChips(); chapterChips.innerHTML="";
    const list = Object.values(wrong);
    if(list.length===0){ main.innerHTML=`<div class="empty">还没有错题，去刷一刷吧 🎉</div>`; return; }
    main.innerHTML = `<div class="card"><div class="qtext">错题本（共 ${list.length} 题，答错次数已记录）</div></div>` +
      list.map(item=>{
        const opts = item.type==="judge"?["正确","错误"]:item.o;
        const rows = opts.map((t,i)=>{
          const L=LETTERS[i];
          const cls=item.a.includes(L)?"correct":"";
          return `<div class="opt disabled ${cls}"><span class="key">${item.type==="judge"?(L==="A"?"✓":"✕"):L}</span><span>${t}</span></div>`;
        }).join("");
        return `<div class="card">
          <div class="meta"><span class="tag ${item.type==='judge'?'judge':item.type==='multi'?'multi':''}">${typeLabel(item.type)}</span>
          <span class="qno">${item.course} · ${item.chapter} · 错 ${item.count} 次</span></div>
          <div class="qtext">${item.q}</div>
          <div class="opts">${rows}</div>
          <div class="answer-box show"><div>正确答案：<span class="ans">${item.a.join("、")}</span></div></div>
          <div class="actions"><button class="btn warn" data-del="${item.qid}">移出错题本</button></div>
        </div>`;
      }).join("");
    [...main.querySelectorAll("[data-del]")].forEach(b=>b.onclick=()=>{
      delete wrong[b.dataset.del]; saveWrong(); renderWrong();
    });
  }

  // ---------- 章节弹层 ----------
  function renderSheet(){
    const mask=$("sheetMask"), sheet=$("chapterSheet");
    let items=[];
    if(state.course==="all"){
      items = DATA.map(c=>({name:c.name, cnt:ALL.filter(x=>x.cid===c.id).length}));
    }else{
      const c=DATA.find(x=>x.id===state.course);
      items = [{name:"全部章节", cnt:ALL.filter(x=>x.cid===c.id).length}]
        .concat(c.chapters.map(ch=>({name:ch.name, cnt:ch.qs.length})));
    }
    sheet.innerHTML = `<h3>选择章节 / 课程</h3>` + items.map(it=>
      `<div class="item" data-name="${it.name}"><span>${it.name}</span><span class="cnt">${it.cnt} 题</span></div>`).join("");
    [...sheet.querySelectorAll(".item")].forEach(el=>el.onclick=()=>{
      const n=el.dataset.name;
      if(state.course==="all"){ const c=DATA.find(x=>x.name===n); state.course=c.id; state.chapter="all"; }
      else{ state.chapter = n==="全部章节"?"all":n; }
      closeSheet(); startQuiz();
    });
    mask.classList.add("show"); sheet.classList.add("show");
  }
  function closeSheet(){ $("sheetMask").classList.remove("show"); $("chapterSheet").classList.remove("show"); }
  $("sheetMask").onclick=closeSheet;

  // ---------- 统计 ----------
  function renderStat(){
    renderCourseChips(); chapterChips.innerHTML="";
    const total=ALL.length;
    const wn=Object.keys(wrong).length;
    const answered=ALL.length-wn; // 粗粒度：错题数之外视为已掌握
    const rate = total? Math.round((answered/total)*100):0;
    const byCourse = DATA.map(c=>{
      const qs=ALL.filter(x=>x.cid===c.id);
      const w=qs.filter(x=>wrong[x.qid]).length;
      return {name:c.name, total:qs.length, w};
    });
    main.innerHTML = `
      <div class="stat-row">
        <div class="stat-box"><div class="num">${total}</div><div class="lbl">题目总数</div></div>
        <div class="stat-box"><div class="num">${wn}</div><div class="lbl">错题</div></div>
        <div class="stat-box"><div class="num">${rate}%</div><div class="lbl">掌握度</div></div>
      </div>
      <div class="card" style="margin-top:14px">
        ${byCourse.map(b=>`<div class="item" style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)">
          <span>${b.name}</span><span class="qno">${b.total} 题 · 错 ${b.w}</span></div>`).join("")}
      </div>
      <div class="empty" style="padding-top:24px">错题与进度保存在本机浏览器，清除缓存会重置</div>`;
  }

  // ---------- Tab 切换 ----------
  document.querySelectorAll(".tabbar button").forEach(btn=>{
    btn.onclick=()=>{
      state.view=btn.dataset.tab; syncTab();
      if(state.view==="quiz") startQuiz();
      else if(state.view==="wrong") renderWrong();
      else if(state.view==="chapter") renderSheet();
      else renderStat();
    };
  });

  startQuiz();
})();
</script>
</body>
</html>
